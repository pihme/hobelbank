<svg viewBox="-10 -10 980 540" width="980" height="540" role="img" aria-label="The whole workshop: the Hermetarium supervisor starts a wall around a habitat where Fregoli, other agents, and a budget MCP can live; all traffic leaves through Squid, with a package proxy and scanner as a later addition; a watching agent could put habitats to sleep and wake them; pushes go through Git Warden to the Git remote. Dashed lines are not built yet." xmlns="http://www.w3.org/2000/svg"><title>The whole workshop: the Hermetarium supervisor starts a wall around a habitat where Fregoli, other agents, and a budget MCP can live; all traffic leaves through Squid, with a package proxy and scanner as a later addition; a watching agent could put habitats to sleep and wake them; pushes go through Git Warden to the Git remote. Dashed lines are not built yet.</title><style>svg{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.bg{fill:#f7f6f3}.dx-box{fill:#fff;stroke:#8a5a2b;stroke-opacity:.8}.dx-box.s{fill:#8a5a2b;stroke:#8a5a2b}.dx-t{fill:#1c1c1e;font-size:15px;font-weight:600}.dx-s{fill:#66666e;font-size:12px}.dx-on{fill:#fff}.dx-sub-on{fill:#fff;opacity:.85;font-size:12px}.dx-reg{fill:none;stroke:#8a5a2b;stroke-dasharray:6 6;stroke-opacity:.9}.dx-rl{fill:#8a5a2b;font-size:13px;font-weight:600}.dx-a{stroke:#8a5a2b;stroke-width:2;fill:none}.dx-a.d{stroke-dasharray:5 5}.dx-m{fill:#8a5a2b}.dx-l{fill:#66666e;font-size:12px}</style><rect class="bg" x="-10" y="-10" width="980" height="540" rx="12"/><defs><marker id="ah-hobelbank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dx-m" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dx-reg" x="10" y="10" width="800" height="400" rx="14"/><text class="dx-rl" x="30" y="36" text-anchor="start">Host: your machine or cluster</text><rect class="dx-reg" x="30" y="136" width="460" height="262" rx="14"/><text class="dx-rl" x="46" y="386" text-anchor="start">Wall: runc (weak) or Firecracker (strong)</text><rect class="dx-reg" x="50" y="160" width="420" height="190" rx="14"/><text class="dx-rl" x="66" y="184" text-anchor="start">Habitat: OCI image, agent is root</text><rect class="dx-box s" x="40" y="50" width="200" height="56" rx="10"/><text class="dx-t dx-on" x="140.0" y="71.0" text-anchor="middle" dominant-baseline="middle">Supervisor</text><text class="dx-sub-on" x="140.0" y="90.0" text-anchor="middle" dominant-baseline="middle">Hermetarium · Go</text><rect class="dx-box" x="330" y="50" width="220" height="56" rx="10"/><text class="dx-t" x="440.0" y="71.0" text-anchor="middle" dominant-baseline="middle">Watching agent</text><text class="dx-s" x="440.0" y="90.0" text-anchor="middle" dominant-baseline="middle">with a budget MCP · possible</text><rect class="dx-box" x="70" y="200" width="180" height="56" rx="10"/><text class="dx-t" x="160.0" y="221.0" text-anchor="middle" dominant-baseline="middle">Fregoli</text><text class="dx-s" x="160.0" y="240.0" text-anchor="middle" dominant-baseline="middle">inhabitant</text><rect class="dx-box" x="270" y="200" width="180" height="56" rx="10"/><text class="dx-t" x="360.0" y="221.0" text-anchor="middle" dominant-baseline="middle">Other agents</text><text class="dx-s" x="360.0" y="240.0" text-anchor="middle" dominant-baseline="middle">inhabitants</text><rect class="dx-box" x="70" y="276" width="380" height="56" rx="10"/><text class="dx-t" x="260.0" y="297.0" text-anchor="middle" dominant-baseline="middle">Budget MCP</text><text class="dx-s" x="260.0" y="316.0" text-anchor="middle" dominant-baseline="middle">grok- or claude- · possible</text><rect class="dx-box" x="560" y="200" width="220" height="62" rx="10"/><text class="dx-t" x="670.0" y="224.0" text-anchor="middle" dominant-baseline="middle">Squid</text><text class="dx-s" x="670.0" y="243.0" text-anchor="middle" dominant-baseline="middle">only way out · I/O log · keys</text><rect class="dx-box" x="560" y="318" width="220" height="56" rx="10"/><text class="dx-t" x="670.0" y="339.0" text-anchor="middle" dominant-baseline="middle">Package proxy + scanner</text><text class="dx-s" x="670.0" y="358.0" text-anchor="middle" dominant-baseline="middle">idea</text><rect class="dx-box" x="840" y="200" width="110" height="62" rx="10"/><text class="dx-t" x="895.0" y="231.0" text-anchor="middle" dominant-baseline="middle">Internet</text><rect class="dx-box" x="560" y="440" width="220" height="56" rx="10"/><text class="dx-t" x="670.0" y="461.0" text-anchor="middle" dominant-baseline="middle">Git Warden</text><text class="dx-s" x="670.0" y="480.0" text-anchor="middle" dominant-baseline="middle">push, merge, pull guards · idea</text><rect class="dx-box" x="840" y="440" width="110" height="56" rx="10"/><text class="dx-t" x="895.0" y="468.0" text-anchor="middle" dominant-baseline="middle">Git remote</text><line class="dx-a" x1="140" y1="106" x2="140" y2="134" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="148" y="124" text-anchor="start">starts</text><line class="dx-a d" x1="330" y1="78" x2="242" y2="78" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="286" y="70" text-anchor="middle">sleep / wake</text><line class="dx-a" x1="470" y1="231" x2="558" y2="231" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="514" y="223" text-anchor="middle">all traffic</text><line class="dx-a" x1="780" y1="231" x2="838" y2="231" marker-end="url(#ah-hobelbank)"/><line class="dx-a d" x1="670" y1="262" x2="670" y2="316" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="678" y="294" text-anchor="start">package fetches</text><line class="dx-a d" x1="380" y1="350" x2="558" y2="456" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="532" y="434" text-anchor="start">git push</text><line class="dx-a d" x1="780" y1="468" x2="838" y2="468" marker-end="url(#ah-hobelbank)"/></svg>

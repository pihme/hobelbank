<svg viewBox="-10 -10 940 320" width="940" height="320" role="img" aria-label="The family at its smallest: on the host, the Hermetarium supervisor starts a wall with an agent inside and a Squid gate; all of the agent&#x27;s traffic leaves through Squid, which logs it and lets only allowlisted destinations through." xmlns="http://www.w3.org/2000/svg"><title>The family at its smallest: on the host, the Hermetarium supervisor starts a wall with an agent inside and a Squid gate; all of the agent&#x27;s traffic leaves through Squid, which logs it and lets only allowlisted destinations through.</title><style>svg{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.bg{fill:#f7f6f3}.dx-box{fill:#fff;stroke:#8a5a2b;stroke-opacity:.8}.dx-box.s{fill:#8a5a2b;stroke:#8a5a2b}.dx-t{fill:#1c1c1e;font-size:15px;font-weight:600}.dx-s{fill:#66666e;font-size:12px}.dx-on{fill:#fff}.dx-sub-on{fill:#fff;opacity:.85;font-size:12px}.dx-reg{fill:none;stroke:#8a5a2b;stroke-dasharray:6 6;stroke-opacity:.9}.dx-rl{fill:#8a5a2b;font-size:13px;font-weight:600}.dx-a{stroke:#8a5a2b;stroke-width:2;fill:none}.dx-a.d{stroke-dasharray:5 5}.dx-m{fill:#8a5a2b}.dx-l{fill:#66666e;font-size:12px}</style><rect class="bg" x="-10" y="-10" width="940" height="320" rx="12"/><defs><marker id="ah-hobelbank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dx-m" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dx-reg" x="10" y="10" width="640" height="280" rx="14"/><text class="dx-rl" x="30" y="36" text-anchor="start">Host: your machine or cluster</text><rect class="dx-reg" x="40" y="140" width="280" height="130" rx="14"/><text class="dx-rl" x="306" y="258" text-anchor="end">Wall</text><rect class="dx-box s" x="40" y="50" width="200" height="56" rx="10"/><text class="dx-t dx-on" x="140.0" y="71.0" text-anchor="middle" dominant-baseline="middle">Supervisor</text><text class="dx-sub-on" x="140.0" y="90.0" text-anchor="middle" dominant-baseline="middle">Hermetarium</text><rect class="dx-box" x="60" y="166" width="200" height="60" rx="10"/><text class="dx-t" x="160.0" y="189.0" text-anchor="middle" dominant-baseline="middle">Inhabitant</text><text class="dx-s" x="160.0" y="208.0" text-anchor="middle" dominant-baseline="middle">an agent, root inside</text><rect class="dx-box" x="400" y="166" width="220" height="60" rx="10"/><text class="dx-t" x="510.0" y="189.0" text-anchor="middle" dominant-baseline="middle">Squid</text><text class="dx-s" x="510.0" y="208.0" text-anchor="middle" dominant-baseline="middle">the only way out, logged</text><rect class="dx-box" x="740" y="166" width="170" height="60" rx="10"/><text class="dx-t" x="825.0" y="189.0" text-anchor="middle" dominant-baseline="middle">Internet</text><text class="dx-s" x="825.0" y="208.0" text-anchor="middle" dominant-baseline="middle">model APIs, packages</text><line class="dx-a" x1="140" y1="106" x2="140" y2="138" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="148" y="126" text-anchor="start">starts</text><line class="dx-a" x1="240" y1="92" x2="470" y2="164" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="370" y="118" text-anchor="start">starts</text><line class="dx-a" x1="260" y1="196" x2="398" y2="196" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="359" y="188" text-anchor="middle">all traffic</text><line class="dx-a" x1="620" y1="196" x2="738" y2="196" marker-end="url(#ah-hobelbank)"/><text class="dx-l" x="658" y="188" text-anchor="start">allowlisted</text></svg>
